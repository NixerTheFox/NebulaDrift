name: Release

# Push a tag like v1.0 to build both versions and publish them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux-appimage.yml

  macos:
    uses: ./.github/workflows/macos-app.yml

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Nebula Drift ${{ github.ref_name }}
          files: |
            dist/Nebula_Drift-x86_64.AppImage
            dist/Nebula_Drift-macOS.zip
          body: |
            An audio visualizer: fly through space while the music drives stars, nebulae, galaxies and black holes, with a retro spacecraft console reacting below the view.

            **macOS** (14.2 or later, Apple silicon and Intel): download `Nebula_Drift-macOS.zip`, unzip it and move **Nebula Drift** to Applications. The app isn't notarized, so the first time right-click it and choose **Open** (or run `xattr -dr com.apple.quarantine "/Applications/Nebula Drift.app"`). Allow **System Audio Recording** when asked.

            **Linux** (x86-64, glibc 2.35+: Ubuntu 22.04, Debian 12, Fedora 36 and newer): download `Nebula_Drift-x86_64.AppImage`, then `chmod +x Nebula_Drift-x86_64.AppImage` and run it. System audio needs PulseAudio or PipeWire.

            Press **H** in the app for the keys.
