name: Release

# Push a tag like v1.0 to build both versions and publish them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux-appimage.yml

  macos:
    uses: ./.github/workflows/macos-app.yml

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Nebula Drift ${{ github.ref_name }}
          files: |
            dist/Nebula_Drift-x86_64.AppImage
            dist/Nebula_Drift-macOS.zip
          body_path: RELEASE_NOTES.md
