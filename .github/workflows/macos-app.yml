name: macOS app

on:
  push:
    branches: ['**']
    paths: ['Sources/**', 'Resources/**', 'build.sh', 'Info.plist', '.github/workflows/macos-app.yml']
  pull_request:
    paths: ['Sources/**', 'Resources/**', 'build.sh', 'Info.plist', '.github/workflows/macos-app.yml']
  workflow_dispatch:
  workflow_call: # from release.yml

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the before/after console comparison

      - name: Build universal app
        run: ./build.sh

      - name: Check the binary
        run: |
          lipo -info "build/Nebula Drift.app/Contents/MacOS/NebulaDrift"
          codesign --verify --verbose "build/Nebula Drift.app"
          test -s "build/Nebula Drift.app/Contents/Resources/AppIcon.icns"

      - name: Benchmark the console
        run: '"build/Nebula Drift.app/Contents/MacOS/NebulaDrift" --bench-console build/bench'

      - name: Compile the Metal shaders
        run: xcrun -sdk macosx metal -c Sources/Shaders.metal -o build/Shaders.air

      - name: Render the test frames
        run: '"build/Nebula Drift.app/Contents/MacOS/NebulaDrift" --snapshot build/snapshots'

      - name: Compare GPU cost with the version before the GPU optimizations (same machine)
        run: |
          rm -rf build/old && mkdir -p build/old/src
          for f in main Instruments Cockpit Stats; do git show 81fe7ae:Sources/$f.swift > build/old/src/$f.swift; done
          ditto "build/Nebula Drift.app" "build/old/Nebula Drift.app"
          git show 81fe7ae:Sources/Shaders.metal > "build/old/Nebula Drift.app/Contents/Resources/Shaders.metal"
          swiftc -O -swift-version 5 -target arm64-apple-macos14.2 -o "build/old/Nebula Drift.app/Contents/MacOS/NebulaDrift" \
            build/old/src/*.swift 2>/dev/null
          codesign --force --sign - "build/old/Nebula Drift.app"
          mkdir -p build/old/snapshots
          for round in 1 2; do
            echo "-- before:"; "build/old/Nebula Drift.app/Contents/MacOS/NebulaDrift" --snapshot build/old/snapshots | grep "frame with"
            echo "-- after:"; "build/Nebula Drift.app/Contents/MacOS/NebulaDrift" --snapshot build/snapshots | grep "frame with"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: console-bench
          path: build/bench

      - name: Zip
        run: ditto -c -k --keepParent "build/Nebula Drift.app" build/Nebula_Drift-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_Drift-macOS.zip
          path: build/Nebula_Drift-macOS.zip
          if-no-files-found: error
