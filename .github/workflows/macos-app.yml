name: macOS app

on:
  push:
    branches: ['**']
    paths: ['Sources/**', 'Resources/**', 'build.sh', 'Info.plist', '.github/workflows/macos-app.yml']
  pull_request:
    paths: ['Sources/**', 'Resources/**', 'build.sh', 'Info.plist', '.github/workflows/macos-app.yml']
  workflow_dispatch:
  workflow_call: # from release.yml

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the before/after console comparison

      - name: Build universal app
        run: ./build.sh

      - name: Check the binary
        run: |
          lipo -info "build/Nebula Drift.app/Contents/MacOS/NebulaDrift"
          codesign --verify --verbose "build/Nebula Drift.app"
          test -s "build/Nebula Drift.app/Contents/Resources/AppIcon.icns"

      - name: Benchmark the console
        run: '"build/Nebula Drift.app/Contents/MacOS/NebulaDrift" --bench-console build/bench'

      - name: Compare the console with the version before the optimizations (same machine)
        run: |
          mkdir -p build/old
          git show 37b02b9:Sources/Instruments.swift > build/old/Instruments.swift
          swiftc -O -swift-version 5 -target arm64-apple-macos14.2 -o build/old/NebulaDrift \
            $(ls Sources/*.swift | grep -v Instruments.swift) build/old/Instruments.swift 2>/dev/null
          for round in 1 2 3; do
            echo "-- before:"; build/old/NebulaDrift --bench-console build/old/bench
            echo "-- after:"; "build/Nebula Drift.app/Contents/MacOS/NebulaDrift" --bench-console build/bench
          done

      - name: Compile the Metal shaders
        run: xcrun -sdk macosx metal -c Sources/Shaders.metal -o build/Shaders.air

      - name: Render the test frames (needs a GPU)
        continue-on-error: true
        run: '"build/Nebula Drift.app/Contents/MacOS/NebulaDrift" --snapshot build/snapshots'

      - uses: actions/upload-artifact@v4
        with:
          name: console-bench
          path: build/bench

      - name: Zip
        run: ditto -c -k --keepParent "build/Nebula Drift.app" build/Nebula_Drift-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_Drift-macOS.zip
          path: build/Nebula_Drift-macOS.zip
          if-no-files-found: error
